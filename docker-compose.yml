services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: parle
      POSTGRES_PASSWORD: parle
      POSTGRES_DB: parle
    ports:
      - "5432:5432"
    volumes:
      - parle-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parle -d parle"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  parle-postgres:
